[workspace]
resolver = "3"
members = ["crates/prism-core", "crates/prism-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
prism-core = { path = "crates/prism-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12.0.1"

# DSP + inference is unusably slow unoptimised; keep dev builds fast to run.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
[profile.release]
lto = "thin"
codegen-units = 4
