# Build: checks, tests on every platform, then installers for every platform Prism supports
# (via package.yml, stamped 0.0.1-ci.<run> so CI builds never look like a real release).
# Runs on pushes to main, on pull requests and on demand. Dependabot's PRs run the full matrix
# like any other PR; "Build result" is the single check to require before merging.
# Needs no secrets, because Dependabot PRs can't read repository secrets.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt
      - name: Typecheck & build UI
        run: npm run build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Generated TypeScript bindings are committed
        run: |
          cargo test -p prism-core --lib -q
          git diff --exit-code src/bindings

  test:
    name: Test (${{ matrix.rid }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26,            rid: osx-arm64 }
          - { os: macos-26-intel,      rid: osx-x64 }
          - { os: windows-2025-vs2026, rid: win-x64 }
          - { os: windows-11-arm,      rid: win-arm64 }
          - { os: ubuntu-26.04,        rid: linux-x64 }
          - { os: ubuntu-26.04-arm,    rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          rust-components: clippy
      - run: npm run build
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit + end-to-end separation on this platform)
        run: cargo test --workspace

  desktop:
    name: Desktop
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.1-ci.${{ github.run_number }}

  # One required check for branch protection and Dependabot PRs: green only when the checks,
  # every platform's tests and every installer succeeded.
  result:
    name: Build result
    if: always()
    needs: [checks, test, desktop]
    runs-on: ubuntu-26.04
    steps:
      - name: All builds succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [[ "$r" == "success" ]] || { echo "::error::A build job did not succeed ($r)."; exit 1; }; done
