# Package: builds Prism's installers for every platform (or the `rids` given) at a given version.
# Called by Build and Build (macOS x64) for CI versions, and by Release for real versions. Installers are named Prism-<version>-<rid>.<ext>.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the app (SemVer).
        type: string
        required: true
      retention-days:
        type: number
        default: 14
      rids:
        description: Space-separated platforms to build (e.g. "macOS-x64"); empty builds all of them.
        type: string
        default: ""
    secrets:
      # Optional. With the signing key the build also makes signed update files for in-app updates.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  # Every platform Prism ships, narrowed to `inputs.rids` when given.
  platforms:
    name: Platforms
    runs-on: ubuntu-26.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        shell: bash
        env:
          RIDS: ${{ inputs.rids }}
        run: |
          set -euo pipefail
          all='[
            { "os": "macos-26",            "rid": "macOS-arm64", "bundles": "app" },
            { "os": "macos-26-intel",      "rid": "macOS-x64",   "bundles": "app" },
            { "os": "windows-2025-vs2026", "rid": "win-x64",     "bundles": "nsis" },
            { "os": "windows-11-arm",      "rid": "win-arm64",   "bundles": "nsis" },
            { "os": "ubuntu-26.04",        "rid": "linux-x64",   "bundles": "appimage,deb" },
            { "os": "ubuntu-26.04-arm",    "rid": "linux-arm64", "bundles": "appimage,deb" }
          ]'
          include=$(jq -c --arg rids "$RIDS" '
            ($rids | split(" ") | map(select(. != ""))) as $want
            | if ($want | length) == 0 then . else map(select(.rid as $r | $want | index($r))) end' <<< "$all")
          [[ "$include" != "[]" ]] || { echo "::error::No known platform in '$RIDS'."; exit 1; }
          echo "include=$include" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.rid }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release

      # The link downloader (yt-dlp) ships inside the app; checksum-verified by the script.
      - name: Fetch downloader
        shell: bash
        run: node scripts/fetch-ytdlp.mjs

      - name: Build (${{ matrix.bundles }})
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config=$(node -e '
            const c = { version: process.env.VERSION };
            const bundle = {};
            // Intel Macs ship the ONNX Runtime dylib inside the bundle.
            if (process.env.ORT_DYLIB_PATH) bundle.resources = { [process.env.ORT_DYLIB_PATH]: "libonnxruntime.dylib" };
            // With the signing key, also make the signed files in-app updates are installed from.
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) bundle.createUpdaterArtifacts = true;
            if (Object.keys(bundle).length) c.bundle = bundle;
            console.log(JSON.stringify(c));
          ')
          # A dropped connection while ort-sys downloads ONNX Runtime fails the build; retry
          # just that case (other failures fail right away).
          for attempt in 1 2 3; do
            if npx tauri build --ci --bundles ${{ matrix.bundles }} --config "$config" 2>&1 | tee build.log; then
              exit 0
            fi
            grep -qE 'ort-sys.*(failed to download|extraction of prebuilt binaries)' build.log || exit 1
            echo "::warning::ONNX Runtime download failed (attempt $attempt), retrying."
            sleep 15
          done
          exit 1

      # macOS: drag-to-install DMG with "READ ME FIRST.txt", plus a render of the icon as macOS
      # shows it (Icon Composer icon from Assets.car, so no grey plate on macOS 26+).
      - name: Make DMG
        if: runner.os == 'macOS'
        run: build/macos/make-dmg.sh target/release/bundle/macos/Prism.app "$VERSION" ${{ matrix.rid }} installers
      # Updater files (only when the build was signed): Prism.app.tar.gz and its signature.
      - name: Collect updater files
        if: runner.os == 'macOS'
        run: |
          mkdir -p installers
          for f in target/release/bundle/macos/*.app.tar.gz; do
            [[ -f "$f" ]] || continue
            cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}.app.tar.gz"
            cp "$f.sig" "installers/Prism-$VERSION-${{ matrix.rid }}.app.tar.gz.sig"
          done
      - name: Render icon preview
        if: runner.os == 'macOS'
        run: swift build/macos/render-icon.swift "$PWD/target/release/bundle/macos/Prism.app" icon-preview-${{ matrix.rid }}.png
      # Only a preview for checking the icon, so a flaky artifact upload mustn't fail the build.
      - name: Upload icon preview
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: icon-preview-${{ matrix.rid }}
          path: icon-preview-${{ matrix.rid }}.png
          retention-days: ${{ inputs.retention-days }}

      # Not dist/: Vite builds the web UI there (frontendDist), and its assets/ folder would end
      # up in the artifact, which `gh release create` can't upload.
      - name: Collect installers
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p installers
          shopt -s globstar nullglob
          for f in target/release/bundle/nsis/*-setup.exe; do
            cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}-setup.exe"
            [[ -f "$f.sig" ]] && cp "$f.sig" "installers/Prism-$VERSION-${{ matrix.rid }}-setup.exe.sig"
          done
          for f in target/release/bundle/appimage/*.AppImage; do
            cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}.AppImage"
            [[ -f "$f.sig" ]] && cp "$f.sig" "installers/Prism-$VERSION-${{ matrix.rid }}.AppImage.sig"
          done
          for f in target/release/bundle/deb/*.deb; do cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}.deb"; done
          ls -la installers

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Prism-${{ matrix.rid }}
          path: installers/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
