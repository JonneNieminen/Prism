# Package: builds Prism's installers for every platform at a given version. Called by Build
# (CI versions) and Release (real versions). Installers are named Prism-<version>-<rid>.<ext>.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into the app (SemVer).
        type: string
        required: true
      retention-days:
        type: number
        default: 14
    secrets:
      # Optional. With the signing key the build also makes signed update files for in-app updates.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  desktop:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26,            rid: osx-arm64,   bundles: app }
          - { os: macos-26-intel,      rid: osx-x64,     bundles: app }
          - { os: windows-2025-vs2026, rid: win-x64,     bundles: nsis }
          - { os: windows-11-arm,      rid: win-arm64,   bundles: nsis }
          - { os: ubuntu-26.04,        rid: linux-x64,   bundles: "appimage,deb" }
          - { os: ubuntu-26.04-arm,    rid: linux-arm64, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release

      # The link downloader (yt-dlp) ships inside the app; checksum-verified by the script.
      - name: Fetch downloader
        shell: bash
        run: node scripts/fetch-ytdlp.mjs

      - name: Build (${{ matrix.bundles }})
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config=$(node -e '
            const c = { version: process.env.VERSION };
            const bundle = {};
            // Intel Macs ship the ONNX Runtime dylib inside the bundle.
            if (process.env.ORT_DYLIB_PATH) bundle.resources = { [process.env.ORT_DYLIB_PATH]: "libonnxruntime.dylib" };
            // With the signing key, also make the signed files in-app updates are installed from.
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) bundle.createUpdaterArtifacts = true;
            if (Object.keys(bundle).length) c.bundle = bundle;
            console.log(JSON.stringify(c));
          ')
          npx tauri build --ci --bundles ${{ matrix.bundles }} --config "$config"

      # macOS: drag-to-install DMG with "READ ME FIRST.txt", plus a render of the icon as macOS
      # shows it (Icon Composer icon from Assets.car, so no grey plate on macOS 26+).
      - name: Make DMG
        if: runner.os == 'macOS'
        run: build/macos/make-dmg.sh target/release/bundle/macos/Prism.app "$VERSION" ${{ matrix.rid }} installers
      # Updater files (only when the build was signed): Prism.app.tar.gz and its signature.
      - name: Collect updater files
        if: runner.os == 'macOS'
        run: |
          mkdir -p installers
          for f in target/release/bundle/macos/*.app.tar.gz; do
            [[ -f "$f" ]] || continue
            cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}.app.tar.gz"
            cp "$f.sig" "installers/Prism-$VERSION-${{ matrix.rid }}.app.tar.gz.sig"
          done
      - name: Render icon preview
        if: runner.os == 'macOS'
        run: swift build/macos/render-icon.swift "$PWD/target/release/bundle/macos/Prism.app" icon-preview-${{ matrix.rid }}.png
      - name: Upload icon preview
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: icon-preview-${{ matrix.rid }}
          path: icon-preview-${{ matrix.rid }}.png
          retention-days: ${{ inputs.retention-days }}

      # Not dist/: Vite builds the web UI there (frontendDist), and its assets/ folder would end
      # up in the artifact, which `gh release create` can't upload.
      - name: Collect installers
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p installers
          shopt -s globstar nullglob
          for f in target/release/bundle/nsis/*-setup.exe; do
            cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}-setup.exe"
            [[ -f "$f.sig" ]] && cp "$f.sig" "installers/Prism-$VERSION-${{ matrix.rid }}-setup.exe.sig"
          done
          for f in target/release/bundle/appimage/*.AppImage; do
            cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}.AppImage"
            [[ -f "$f.sig" ]] && cp "$f.sig" "installers/Prism-$VERSION-${{ matrix.rid }}.AppImage.sig"
          done
          for f in target/release/bundle/deb/*.deb; do cp "$f" "installers/Prism-$VERSION-${{ matrix.rid }}.deb"; done
          ls -la installers

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Prism-${{ matrix.rid }}
          path: installers/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
