[package]
name = "prism-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prism engine: audio IO, DSP, pluggable separators, models, library. No UI/Tauri deps."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac", "adpcm"] }
rubato = "0.16.2"
realfft = "3.5.1"
hound = "3.5.1"
flacenc = "0.5.1"
mp3lame-encoder = { version = "0.3.0", default-features = false }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.29.1", features = ["v4"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "coreml", "api-31"] }
ureq = "3.1.4"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
